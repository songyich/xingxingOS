# =============================================================================
#  GRUB 配置：被 grub-mkrescue 打进 ISO 的 /boot/grub/grub.cfg
#  ---------------------------------------------------------------------------
#  关键点：
#    - multiboot2 命令 = 用 Multiboot2 协议加载内核
#    - GRUB 会读内核里的「帧缓冲请求标签」（type 5，见 boot32.asm），
#      自动切进图形模式，然后把帧缓冲信息写进信息结构交给内核。
#    - 这里的 gfxpayload 只是给 GRUB 自己的菜单界面定分辨率，
#      真正给内核用的模式由内核头里的标签决定。
#
#  同一份配置同时服务 BIOS 和 UEFI 两种启动方式，不用改。
# =============================================================================

set timeout=0
set default=0

# 让 GRUB 菜单本身也用高分辨率，避免 UEFI 下菜单挤成一团
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "xingxingOS - phase 2 (screen output)" {
    multiboot2 /boot/xingxingos.elf
    boot
}

menuentry "xingxingOS - phase 2 (force 800x600)" {
    insmod vbe
    set gfxpayload=800x600x32
    multiboot2 /boot/xingxingos.elf
    boot
}
